name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black pytest
          # Only install runtime deps if requirements.txt exists and works
          pip install -r requirements-ci.txt

      - name: Lint with ruff
        run: ruff check src/ || true

      - name: Format check with black
        run: black --check src/ || true

      - name: Unit tests
        run: |
          if [ -d tests ]; then
            pytest tests/ -v
          else
            echo "No tests/ directory yet; skipping."
          fi